
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <title>ABETHIE WATER MANAGEMENT - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1f3a;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #0b1f3a;
      font-size: 25px;
    }

    .subtitle {
      margin-bottom: 25px;
      text-align: center;
      color: #666;
    }

    .language-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    select {
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #0b1f3a;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #d6a84f;
      color: #0b1f3a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="language-row">
      <select id="languageSelect" aria-label="Choose language">
        <option value="en">English</option>
        <option value="rw">Kinyarwanda</option>
      </select>
    </div>

    <h1>ABETHIE WATER MANAGEMENT</h1>
    <p class="subtitle" id="subtitle">Administrator Sign In</p>

    <form id="loginForm">

      <label for="email" id="emailLabel">Email address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="username"
        required
      >

      <label for="password" id="passwordLabel">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">Sign In</button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="footer">
      ABETHIE WATER MANAGEMENT
    </div>

  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const translations = {
      en: {
        subtitle: "Administrator Sign In",
        emailLabel: "Email address",
        emailPlaceholder: "Enter your email",
        passwordLabel: "Password",
        passwordPlaceholder: "Enter your password",
        loginButton: "Sign In",
        signingIn: "Signing in...",
        success: "Login successful. Redirecting...",
        error: "Login failed. Check your email and password.",
        errorCode: "Error: ",
        required: "Please enter your email and password."
      },

      rw: {
        subtitle: "Kwinjira k'Umuyobozi",
        emailLabel: "Imeyili",
        emailPlaceholder: "Andika imeyili yawe",
        passwordLabel: "Ijambo ry'ibanga",
        passwordPlaceholder: "Andika ijambo ry'ibanga",
        loginButton: "Injira",
        signingIn: "Turimo kukwinjiza...",
        success: "Winjiye neza. Turafungura Dashboard...",
        error: "Kwinjira byanze. Reba imeyili n'ijambo ry'ibanga.",
        errorCode: "Ikosa: ",
        required: "Andika imeyili n'ijambo ry'ibanga."
      }
    };

    const languageSelect = document.getElementById("languageSelect");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    let currentLanguage = localStorage.getItem("abethieLanguage") || "en";
    let isSigningIn = false;

    function translatePage(language) {
      currentLanguage = language;
      localStorage.setItem("abethieLanguage", language);

      const t = translations[language];

      document.documentElement.lang = language;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("emailLabel").textContent = t.emailLabel;
      document.getElementById("email").placeholder = t.emailPlaceholder;
      document.getElementById("passwordLabel").textContent = t.passwordLabel;
      document.getElementById("password").placeholder = t.passwordPlaceholder;

      if (!isSigningIn) {
        loginButton.textContent = t.loginButton;
      }

      languageSelect.value = language;
    }

    languageSelect.addEventListener("change", () => {
      translatePage(languageSelect.value);
    });

    translatePage(currentLanguage);

    onAuthStateChanged(auth, (user) => {
      if (user && !isSigningIn) {
        window.location.replace("./index.html");
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const t = translations[currentLanguage];

      if (!email || !password) {
        message.textContent = t.required;
        return;
      }

      isSigningIn = true;
      loginButton.disabled = true;
      loginButton.textContent = t.signingIn;
      message.textContent = "";

      try {
        await signInWithEmailAndPassword(auth, email, password);

        message.textContent = translations[currentLanguage].success;

        window.location.replace("./index.html");

      } catch (error) {
        console.error("Login error:", error);

        isSigningIn = false;
        loginButton.disabled = false;
        loginButton.textContent = translations[currentLanguage].loginButton;

        message.textContent =
          translations[currentLanguage].error +
          " " +
          translations[currentLanguage].errorCode +
          error.code;
      }
    });
  </script>

</body>
</html>
